name: kleinanzeigen-watch

# GitHub-Cron ist unzuverlaessig: trotz "*/5" kamen Laeufe im Abstand von 40 Minuten.
# Deshalb ein Lauf pro Stunde, der intern alle 5 Minuten prueft (Schleife).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Nur Testnachricht an Telegram senden"
        type: boolean
        default: false

concurrency:
  group: kleinanzeigen-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Zustand wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            state-

      - name: Testnachricht
        if: ${{ inputs.test_message }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -m watcher --test-telegram

      - name: Suche pruefen (12 Durchlaeufe, alle 5 Minuten)
        if: ${{ !inputs.test_message }}
        shell: bash
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -o pipefail
          for i in $(seq 1 12); do
            echo "===== Durchlauf $i von 12 um $(date -u +%H:%M:%S) UTC ====="
            python -m watcher || echo "Durchlauf $i fehlgeschlagen - mache weiter"
            if [ "$i" -lt 12 ]; then
              echo "warte 5 Minuten ..."
              sleep 300
            fi
          done

      - name: Zustand sichern
        if: always() && hashFiles('state.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
